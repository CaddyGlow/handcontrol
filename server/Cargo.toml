[package]
name = "handcontrol-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "handcontrol"
path = "src/lib.rs"

[[bin]]
name = "handcontrol"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.0", features = ["derive"] }
directories = "6.0.0"
dirs = "5.0.1"
hex = "0.4.3"
hostname = "0.4.0"
if-addrs = "0.13"
mdns-sd = "0.15.1"
pem = "3.0.6"
prost = { workspace = true }
rand = "0.8"
rcgen = "0.14.5"
tonic-prost = { workspace = true }
regex = "1.11.1"
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.37", features = ["serde", "std", "formatting", "parsing"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true }
qr2term = "0.3.3"
shell-escape = "0.1.5"
socket2 = "0.5.7"
notify = { version = "7.0.0", default-features = false, features = ["macos_kqueue"] }
async-stream = "0.3"

# Platform-specific notification support
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11.3"

[dev-dependencies]
tempfile = "3.15.0"

[build-dependencies]
prost-build = { workspace = true }
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
