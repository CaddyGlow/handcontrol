[package]
name = "handcontrol-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "handcontrol"
path = "src/lib.rs"

[[bin]]
name = "handcontrol"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
dirs = "6.0"
hex = "0.4"
hostname = "0.4"
if-addrs = "0.14"
mdns-sd = "0.16"
pem = "3.0"
prost = { workspace = true }
rand = "0.9"
rcgen = "0.14"
tonic-prost = { workspace = true }
regex = "1.11"
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "std", "formatting", "parsing"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true }
qr2term = "0.3"
shell-escape = "0.1"
socket2 = "0.6"
notify = { version = "8.0", default-features = false, features = [
  "macos_kqueue",
] }
async-stream = "0.3"
tokio-tungstenite = { workspace = true, features = ["connect"] }
tungstenite = { workspace = true }
futures-util = { workspace = true }
url = "2.5"
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
base64ct = { workspace = true }
spki = { workspace = true }

# Platform-specific notification support
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

[dev-dependencies]
tempfile = "3.15"

[build-dependencies]
prost-build = { workspace = true }
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
