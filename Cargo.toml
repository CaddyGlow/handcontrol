[workspace]
members = ["server", "relay"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.100"
prost = "0.14.1"
tonic = { version = "0.14.2", features = ["tls-webpki-roots"] }
tonic-prost = "0.14.2"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync", "net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
rustls = "0.23.34"
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.3"
toml = "0.9.8"

[workspace.dependencies.prost-build]
version = "0.14.1"

[workspace.dependencies.tonic-build]
version = "0.14.2"

[workspace.dependencies.tonic-prost-build]
version = "0.14.2"
