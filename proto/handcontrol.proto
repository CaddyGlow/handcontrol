syntax = "proto3";

package handcontrol.v1;

option java_multiple_files = true;
option java_package = "com.handcontrol.grpc";
option java_outer_classname = "HandControlProto";

// Main service
service RemoteControl {
  // Enrollment: QR code mode (token-based)
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc GenerateEnrollmentQR(GenerateEnrollmentQRRequest) returns (GenerateEnrollmentQRResponse);

  // Enrollment: Approval mode (interactive)
  rpc RequestPairing(RequestPairingRequest) returns (RequestPairingResponse);
  rpc CheckPairingStatus(CheckPairingStatusRequest) returns (CheckPairingStatusResponse);
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);
  rpc ListPendingPairings(ListPendingPairingsRequest) returns (ListPendingPairingsResponse);

  // Get server information
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoResponse);

  // List available capabilities
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);

  // Open a capability session (one-shot or realtime)
  rpc OpenSession(stream SessionClientMessage) returns (stream SessionServerMessage);

  // Config hot-reload APIs
  rpc GetConfigVersion(GetConfigVersionRequest) returns (GetConfigVersionResponse);
  rpc WatchConfigUpdates(WatchConfigUpdatesRequest) returns (stream ConfigUpdateNotification);
}

// Enrollment (QR code mode)
message EnrollRequest {
  string enrollment_token = 1;
  bytes client_certificate = 2;  // Full X.509 certificate (DER-encoded)
  string device_name = 3;
}

message EnrollResponse {
  bool success = 1;
  string client_id = 2;
  string error_message = 3;

  // Optional relay information for cross-network connectivity
  optional RelayInfo relay_info = 4;
}

message GenerateEnrollmentQRRequest {}

message GenerateEnrollmentQRResponse {
  bool success = 1;
  string qr_payload = 2;  // JSON payload for QR code
  repeated string server_ips = 3;  // Changed from single server_ip (Breaking change)
  int32 server_port = 4;           // Renumbered from 5
  string server_cert_fingerprint = 5;
  string server_id = 6;
  string enrollment_token = 7;     // Moved from 3
  int32 ttl_seconds = 8;
  string error_message = 9;

  // Reserved for future relay support (optional)
  optional RelayInfo relay_info = 10;
  string valid_until = 11;         // RFC3339 expiry timestamp for enrollment token
}

// Enrollment (Approval mode with verification code)
message RequestPairingRequest {
  string device_name = 1;
  string device_model = 2;
  bytes client_certificate = 3;     // Full X.509 certificate (DER-encoded)
  string verification_code = 4;     // Client's computed verification code
}

message RequestPairingResponse {
  bool pending = 1;
  string pairing_request_id = 2;
  int32 timeout_seconds = 3;
  string verification_code = 4;     // Server's computed verification code
  bytes server_cert_fingerprint = 5; // SHA256 of server certificate
  string error_message = 6;         // If verification mismatch, approval mode disabled, or other error
  bytes verification_nonce = 7;     // Random nonce used in verification code computation (prevents precomputation attacks)
}

message CheckPairingStatusRequest {
  string pairing_request_id = 1;
}

message CheckPairingStatusResponse {
  PairingStatus status = 1;
  string client_id = 2;
  string error_message = 3;

  // Optional relay information for cross-network connectivity
  optional RelayInfo relay_info = 4;
}

message ApprovePairingRequest {
  string pairing_request_id = 1;
}

message ApprovePairingResponse {
  bool success = 1;
  string client_id = 2;
  string error_message = 3;
}

message ListPendingPairingsRequest {}

message ListPendingPairingsResponse {
  repeated PendingPairingInfo requests = 1;
}

message PendingPairingInfo {
  string request_id = 1;
  string device_name = 2;
  string device_model = 3;
  string verification_code = 4;
  int64 expires_at_unix = 5;  // Unix timestamp in seconds
  int32 seconds_remaining = 6;
  string ip_address = 7;  // Client IP address
}

enum PairingStatus {
  PAIRING_STATUS_UNSPECIFIED = 0;
  PAIRING_STATUS_PENDING = 1;
  PAIRING_STATUS_APPROVED = 2;
  PAIRING_STATUS_REJECTED = 3;
  PAIRING_STATUS_TIMEOUT = 4;
}

// Relay information (future use, not yet implemented)
message RelayInfo {
  string relay_url = 1;           // Relay server URL
  string relay_token = 2;          // JWT token for relay authentication
  bool relay_required = 3;        // If true, skip direct connection attempts
}

// Server info
message ServerInfoRequest {}

message ServerInfoResponse {
  string server_id = 1;
  string hostname = 2;
  string version = 3;
  string os = 4;
}

// Capability listing
message ListCapabilitiesRequest {}

message ListCapabilitiesResponse {
  repeated Capability capabilities = 1;
  uint64 config_version = 2;
}

enum CapabilityKind {
  CAPABILITY_KIND_UNSPECIFIED = 0;
  CAPABILITY_KIND_SHELL_SCRIPT = 1;
  CAPABILITY_KIND_SHELL_INTERACTIVE = 2;
  CAPABILITY_KIND_FILE_TRANSFER = 3;
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_ONE_SHOT = 1;
  SESSION_MODE_REALTIME = 2;
  SESSION_MODE_UPLOAD = 3;
  SESSION_MODE_DOWNLOAD = 4;
}

message Capability {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  CapabilityKind kind = 5;
  SessionMode session_mode = 6;
  repeated CapabilityParameter parameters = 7;
  optional bool requires_confirmation = 8;
  optional bool privileged = 9;
  optional uint64 version = 10;
}

enum CapabilityParameterType {
  CAPABILITY_PARAMETER_TYPE_UNSPECIFIED = 0;
  CAPABILITY_PARAMETER_TYPE_SLIDER = 1;
  CAPABILITY_PARAMETER_TYPE_TEXT = 2;
  CAPABILITY_PARAMETER_TYPE_TOGGLE = 3;
  CAPABILITY_PARAMETER_TYPE_DROPDOWN = 4;
}

message CapabilityParameter {
  string name = 1;
  CapabilityParameterType type = 2;
  string description = 3;
  optional int32 min = 4;
  optional int32 max = 5;
  optional string default_value = 6;
  repeated string options = 7;
  optional string validation = 8;
  optional string label_on = 9;
  optional string label_off = 10;
  optional string default_value_command = 11;
  optional string default_value_pattern = 12;
}

// Session streaming
message SessionClientMessage {
  string session_id = 1;
  oneof payload {
    SessionOpen open = 2;
    SessionInput input = 3;
    SessionResize resize = 4;
    SessionHeartbeat heartbeat = 5;
    SessionClose close = 6;
    SessionResume resume = 7;
  }
}

message SessionServerMessage {
  string session_id = 1;
  oneof payload {
    SessionReady ready = 2;
    SessionOutput output = 3;
    SessionExit exit = 4;
    SessionError error = 5;
    SessionHeartbeatAck heartbeat = 6;
    SessionClosed closed = 7;
    SessionResumeAck resume_ack = 8;
  }
}

message SessionOpen {
  string capability_id = 1;
  map<string, string> parameters = 2;
  optional string request_id = 3;
}

message SessionResume {
  string resume_token = 1;
  optional uint64 last_output_sequence = 2;
  optional uint64 last_error_sequence = 3;
}

message SessionInput {
  bytes data = 1;
  optional bool binary = 2;
}

message SessionResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message SessionHeartbeat {
  int64 timestamp_ms = 1;
}

message SessionClose {
  optional string reason = 1;
}

message SessionReady {
  string capability_id = 1;
  SessionMode session_mode = 2;
  optional string message = 3;
  string resume_token = 4;
}

message SessionOutput {
  bytes data = 1;
  optional bool stderr = 2;
  optional bool binary = 3;
  optional int64 timestamp_ms = 4;
  uint64 sequence = 5;
}

message SessionExit {
  int32 exit_code = 1;
  optional bool timed_out = 2;
  optional string message = 3;
}

message SessionError {
  string message = 1;
  optional int32 code = 2;
}

message SessionHeartbeatAck {
  int64 timestamp_ms = 1;
  optional int64 latency_hint_ms = 2;
}

message SessionClosed {
  optional string reason = 1;
}

message SessionResumeAck {
  string resume_token = 1;
  optional bool replay_complete = 2;
  optional string message = 3;
}

// Config hot-reload messages
message GetConfigVersionRequest {}

message GetConfigVersionResponse {
  uint64 config_version = 1;       // Current config version number
  int64 last_updated_ms = 2;       // Unix timestamp of last config reload
}

message WatchConfigUpdatesRequest {}

message ConfigUpdateNotification {
  uint64 config_version = 1;       // New config version number
  int64 timestamp_ms = 2;          // Unix timestamp of this update
}

// Relay service (runs on relay server)
service RelayService {
  // Server registers to accept client connections
  rpc RegisterServer(stream ServerRelayMessage) returns (stream RelayControlMessage);

  // Client connects to registered server
  rpc ConnectToServer(stream ClientRelayMessage) returns (stream ServerRelayMessage);
}

// Server -> Relay messages
message ServerRelayMessage {
  oneof message {
    RegisterServerRequest register = 1;
    bytes data = 2;              // Encrypted gRPC data from server
    Ping ping = 3;
    Pong pong = 4;
  }
}

message RegisterServerRequest {
  string server_id = 1;
  string relay_secret = 2;       // Server's authentication secret
  string server_version = 3;
  repeated string capabilities = 4;
}

// Relay -> Server messages
message RelayControlMessage {
  oneof message {
    RegisterServerResponse register_response = 1;
    ClientConnectedNotification client_connected = 2;
    bytes data = 3;              // Encrypted gRPC data from client
    Ping ping = 4;
    Pong pong = 5;
  }
}

message RegisterServerResponse {
  bool success = 1;
  string error_message = 2;
}

message ClientConnectedNotification {
  string client_id = 1;
  string tunnel_id = 2;          // Unique ID for this tunnel
}

// Client -> Relay messages
message ClientRelayMessage {
  oneof message {
    ConnectToServerRequest connect = 1;
    bytes data = 2;              // Encrypted gRPC data from client
    Ping ping = 3;
    Pong pong = 4;
  }
}

message ConnectToServerRequest {
  string server_id = 1;
  string relay_token = 2;        // JWT token issued by server
}

// Keep-alive messages
message Ping {
  int64 timestamp_ms = 1;
}

message Pong {
  int64 timestamp_ms = 1;
}
