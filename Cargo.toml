[package]
name = "handcontrol"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.0", features = ["derive"] }
directories = "6.0.0"
dirs = "5.0.1"
hex = "0.4.3"
hostname = "0.4.0"
mdns-sd = "0.15.1"
pem = "3.0.6"
prost = "0.14.1"
rcgen = "0.14.5"
tonic-prost = "0.14.2"
regex = "1.11.1"
rustls = "0.23.34"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.37", features = ["serde", "std", "formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync", "net"] }
toml = "0.9.8"
tonic = { version = "0.14.2", features = ["tls-webpki-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
webpki-roots = "1.0.3"
qr2term = "0.3.3"
shell-escape = "0.1.5"
socket2 = "0.5.7"

# Platform-specific notification support
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11.3"

[dev-dependencies]
tempfile = "3.15.0"

[build-dependencies]
prost-build = "0.14.1"
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
