[workspace]
members = ["server", "relay"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
prost = "0.14"
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-prost = "0.14"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
rustls = "0.23"
rustls-pemfile = "2.2"
webpki-roots = "1.0"
toml = "0.9"
axum = { version = "0.7", features = ["ws", "macros"] }
tokio-tungstenite = { version = "0.25", default-features = false, features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.21"
futures-util = "0.3"
tower = "0.5"
jsonwebtoken = { version = "10.1", features = ["rust_crypto"] }
ed25519-dalek = "2.2.0"
base64 = "0.22"
base64ct = "1.8"
spki = "0.7"

[workspace.dependencies.prost-build]
version = "0.14"

[workspace.dependencies.tonic-build]
version = "0.14"

[workspace.dependencies.tonic-prost-build]
version = "0.14"
