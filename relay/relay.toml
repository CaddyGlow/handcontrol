# Address and port the relay listens on.
bind_address = "0.0.0.0"
port = 8443

# Optional hostname or IP advertised to clients. When omitted, the relay
# detects the default-route IP automatically.
# public_hostname = "relay.example.com"

# Seconds to wait for both tunnel endpoints to send `tunnel_ready`.
handshake_timeout_seconds = 5

[registration_secrets]
# server_id = base64-encoded registration secret used during /register handshake
"00000000-0000-0000-0000-000000000001" = "IFLhGtF13jMg+MHhajgEhbeZr+CruHLBC48Hw1KSNaU="
